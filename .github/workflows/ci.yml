name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # A test process that dies can still exit 0, so the run must also report that it finished.
      - run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q "Test run with .* passed" "$RUNNER_TEMP/test.log"
        shell: bash

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # A test process that dies can still exit 0, so the run must also report that it finished.
      - run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q "Test run with .* passed" "$RUNNER_TEMP/test.log"
        env:
          JSON_SCHEMA_FIXTURES: ${{ runner.temp }}/json-schema-fixtures
      - name: Check schemas with an independent JSON Schema 2020-12 validator
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "jsonschema==4.23.0"
          "$RUNNER_TEMP/venv/bin/python" Scripts/validate-json-schemas.py "$RUNNER_TEMP/json-schema-fixtures"
